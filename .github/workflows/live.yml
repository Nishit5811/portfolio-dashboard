name: Live prices (market hours)

# One long-running job per trading day refreshes prices every 3 minutes and pushes them to the
# `live-data` branch, which the dashboard reads directly. The extra hourly triggers are safety
# nets in case GitHub delays or skips the opening one: a run that starts while another is going
# waits in the queue, and exits at once if the session is over.
on:
  schedule:
    - cron: "35 3 * * 1-5"      # 09:05 IST
    - cron: "5 4-9 * * 1-5"     # 09:35 … 14:35 IST safety nets
  push:
    branches: [main]
    paths: [".github/workflows/live.yml", "live_loop.py", "build_data.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-prices
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python live_loop.py --every 3
