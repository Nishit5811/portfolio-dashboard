name: Live prices (market hours)

# One long-running job per trading day refreshes prices every 3 minutes and pushes them to the
# `live-data` branch, which the dashboard reads directly. The extra hourly triggers are safety
# nets in case GitHub delays or skips the opening one: a run that starts while another is going
# waits in the queue, and exits at once if the session is over.
on:
  schedule:
    # GitHub often starts scheduled runs hours late (or skips them), so there are several
    # attempts from 04:00 IST. A run that starts before the open waits for it; extra runs
    # queue behind the active one and exit at once if there's nothing left to do.
    - cron: "30 22 * * 0-4"     # 04:00 IST Mon–Fri
    - cron: "0 0,1,2,3 * * 1-5" # 05:30, 06:30, 07:30, 08:30 IST
    - cron: "5 4-9 * * 1-5"     # 09:35 … 14:35 IST
  push:
    branches: [main]
    paths: [".github/workflows/live.yml", "live_loop.py", "build_data.py"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: live-prices-v2
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python live_loop.py --every 3 --site-every 6
        env:
          GH_TOKEN: ${{ github.token }}
