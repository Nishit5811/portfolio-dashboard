name: Refresh portfolio dashboard

on:
  schedule:
    # Live prices during the session come from live.yml (every 3 min, via the live-data branch).
    # This rebuilds the site itself: after the close, in the evening, and once a day at weekends.
    - cron: "50 10 * * 1-5"
    - cron: "7 16 * * *"
  push:
    paths: ["inputs/**", "config.json", "build_data.py", "site/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
