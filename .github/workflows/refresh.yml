name: Refresh portfolio dashboard

on:
  schedule:
    # Every 15 minutes through the Indian trading day (08:30–16:15 IST = 03:00–10:45 UTC), Mon–Fri,
    # plus one run a day at weekends. Times are UTC. GitHub may start scheduled runs a few minutes late.
    - cron: "*/15 3-10 * * 1-5"
    - cron: "7 13,16 * * 1-5"
    - cron: "33 6 * * 0,6"
  push:
    paths: ["inputs/**", "config.json", "build_data.py", "site/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
